workflows:
  ios-workflow:
    name: iOS App Store Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      groups:
        - app_store_creds  # Ensure this group contains your API Key variables
      vars:
        XCODE_VERSION: latest
        FCI_KEYCHAIN: codemagic_keychain
        flutter: stable
        APP_BUNDLE_ID: "com.bps.pendeza"

    scripts:
      - name: Set up keychain
        script: keychain initialize
      
      - name: Fetch signing files
        script: |
          # We use the specific Bundle ID from your screenshot
          # The --create flag only works if your API Key has "Admin" or "Developer" access
          app-store-connect fetch-signing-files "$APP_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          
          # This command searches for the .p12 created by the step above and installs it
          keychain add-certificates
      
      - name: Set up Xcode signing
        script: xcode-project use-profiles

      - name: Get Flutter packages
        script: flutter pub get

      - name: Install Pods
        # Simplified for Mac environment
        script: |
          cd ios
          pod install
          cd ..

      - name: Build IPA
        script: |
          # Use --build-name and --build-number if needed, 
          # but basic release build is fine.
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - "*.dSYM.zip"  

    publishing:
      app_store_connect:
        # These variables MUST match the names in your Environment Variable Group
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
