workflows:
  ios-app-store:
    name: Pendeza Booking App - iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Pendeza Api Key   # ← exact name

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios && pod install --repo-update

      - name: Create distribution certificate automatically (bypass p12)
        script: |
          app-store-connect create-certificate --type IOS_DISTRIBUTION

      - name: Fetch or create App Store provisioning profile
        script: |
          app-store-connect fetch-signing-files com.bps.pendeza \
            --type IOS_APP_STORE \
            --create

      - name: Set up code signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Build IPA for App Store
        script: |
          flutter build ipa --release \
            --build-name=1.0 \
            --build-number=1

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - dimanshilla255@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: true
