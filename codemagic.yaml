workflows:
  ios-workflow:
    name: iOS App Store Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      vars:
        # Codemagic will look for these in your "Global" Environment variables
        APP_STORE_CONNECT_PRIVATE_KEY: $APP_STORE_CONNECT_PRIVATE_KEY
        APP_STORE_CONNECT_ISSUER_ID: $APP_STORE_CONNECT_ISSUER_ID
        APP_STORE_CONNECT_KEY_IDENTIFIER: $APP_STORE_CONNECT_KEY_IDENTIFIER
        XCODE_VERSION: latest
        FCI_KEYCHAIN: codemagic_keychain
        flutter: stable
    
    scripts:
      - name: Set up keychain
        script: keychain initialize
      
      - name: Fetch signing files
        script: |
          # Fetching files for com.bps.pendeza
          app-store-connect fetch-signing-files "com.bps.pendeza" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
      
      - name: Set up Xcode signing
        script: xcode-project use-profiles

      - name: Get Flutter packages
        script: flutter pub get

      - name: Install Pods
        # This now uses the Podfile you just added
        script: find . -name "Podfile" -exec dir {} \; && cd ios && pod install && cd ..

      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - "*.dSYM.zip"   <-- QUOTES ADDED

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
